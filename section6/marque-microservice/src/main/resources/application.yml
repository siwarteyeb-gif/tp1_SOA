spring:
  application:
    name: marque-microservice

  datasource:
    url: 'jdbc:h2:mem:marquedb'

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: '*'

build:
  version: 1.0

author:
  name: "siwar Marque"
  email: "siwarteyeb_Marque@gmail.com"