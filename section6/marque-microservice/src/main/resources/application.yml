spring:
  application:
    name: marque-microservice

  config:
    import: "optional:configserver:http://localhost:9999/"

  profiles:
    active: "prod"

  datasource:
    url: 'jdbc:h2:mem:marquedb'

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  cloud:
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

management:
  endpoints:
    web:
      exposure:
        include: '*'