server:
  port: 8888

spring:
  application:
    name: gatewayserver

  cloud:
    config:
      enabled: false

    discovery:
      enabled: true

    gateway:
      server:
        webflux:
          # Partie 2 : routage par defaut (via Eureka)
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          # Partie 4 : routes configurees dans application.yml
          routes:
            - id: r1
              uri: lb://MARQUE-MICROSERVICE
              predicates:
                - Path=/api/marques/**
            - id: r2
              uri: lb://PARFUM
              predicates:
                - Path=/api/parfums/**

eureka:
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'

  endpoint:
    gateway:
      access: unrestricted