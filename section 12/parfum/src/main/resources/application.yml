  server:
    port: 8081

  spring:
    application:
      name: parfum

    config:
      import: "optional:configserver:http://localhost:9999"

    # rabbitmq:
    #   host: localhost
    #   port: 5672
    #   username: guest
    #   password: guest

    datasource:
      url: 'jdbc:h2:mem:parfumsdb'

    h2:
      console:
        enabled: true

    jpa:
      show-sql: true
      hibernate:
        ddl-auto: update

    cloud:
      config:
        enabled: true
      discovery:
        enabled: true
      openfeign:
        circuitbreaker:
          enabled: true

  eureka:
    client:
      service-url:
        defaultZone: 'http://localhost:8761/eureka/'
    instance:
      prefer-ip-address: true
      hostname: localhost

  resilience4j:
    circuitbreaker:
      configs:
        default:
          slidingWindowSize: 10
          permittedNumberOfCallsInHalfOpenState: 2
          failureRateThreshold: 50
          waitDurationInOpenState: 10000

  management:
    endpoints:
      web:
        exposure:
          include: '*'

  author:
    name: "siwar Marque"
    email: "siwarteb_Marque@gmail.com"
