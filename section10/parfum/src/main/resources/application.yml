
server:
  port: 8081

spring:
  application:
    name: parfum

  config:
    import: "optional:configserver:http://localhost:9999"

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    url: 'jdbc:h2:mem:parfumsdb'

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  cloud:
    config:
      enabled: true
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'

management:
  endpoints:
    web:
      exposure:
        include: '*'

author:
  name: "siwar Marque"
  email: "siwarteyeb_Marque@gmail.com"
